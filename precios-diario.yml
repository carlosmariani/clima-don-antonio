name: Precios MCBA - detección automática

# Corre cada 30 min entre 17:00 y 23:00 ART (20:00-02:00 UTC) lunes a viernes,
# y también algunas veces el sábado por si el MCBA publica los datos del viernes
# durante el fin de semana. Cada corrida revisa si hay datos nuevos del MCBA;
# si los hay y aún no se mandó email para esa fecha, lo manda.
on:
  schedule:
    - cron: '*/30 20-23 * * 1-5'    # 17:00-20:00 ART lun-vie
    - cron: '*/30 0-2 * * 2-6'      # 21:00-23:00 ART (martes-sábado UTC)
    - cron: '0 14,17,20 * * 6'      # Sábado: 11h, 14h y 17h ART por si publican el viernes tarde
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generar PDF de precios completo (todas las zonas)
        run: python generar_precios.py

      - name: Generar PDFs por zona (10 archivos para filtro en PWA)
        run: |
          mkdir -p informes/por_zona
          python <<'PYEOF'
          import json, os, shutil, subprocess, sys, unicodedata, glob

          def slug(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode('ascii')
              return s.lower().replace(' ', '_').replace('.', '')

          cfg = json.load(open('config.json'))
          # Solo zonas del grupo Don Antonio (las de Nader son otro reporte)
          zonas = [l['nombre'] for l in cfg['localidades']
                   if not l.get('grupo') or l.get('grupo') == 'don_antonio']
          print(f"→ Procesando {len(zonas)} zonas: {zonas}")
          ok, fail = [], []

          for zona in zonas:
              s = slug(zona)
              salida = f"informes/por_zona/precios_{s}.pdf"
              print(f"\n{'='*60}")
              print(f"▶ Zona: {zona}  (slug: {s})")
              print('='*60)
              # Llamar al script con --salida explícita para evitar globs
              cmd = ['python', 'generar_precios.py', '--zona', zona, '--salida', salida]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode == 0 and os.path.exists(salida):
                  size = os.path.getsize(salida)
                  print(f"✓ {zona}: {size} bytes en {salida}")
                  ok.append(zona)
              else:
                  print(f"✗ {zona}: FALLÓ")
                  print("STDOUT:", r.stdout[-1500:])
                  print("STDERR:", r.stderr[-500:])
                  fail.append(zona)

          print(f"\n{'='*60}")
          print(f"RESUMEN: {len(ok)} OK, {len(fail)} fallidas")
          if fail:
              print(f"Fallaron: {fail}")
          print(f"PDFs generados:")
          for f in sorted(glob.glob('informes/por_zona/*.pdf')):
              print(f"  {f}  ({os.path.getsize(f)} bytes)")
          # No fallamos el job por una zona — el reporte completo ya existe
          PYEOF

      - name: Detectar si hay datos nuevos del MCBA
        id: check
        run: |
          # Lee la fecha ISO de los datos en el JSON resumen
          FECHA_NUEVA=$(python -c "import json; d=json.load(open('informes/precios_hoy_resumen.json')); print(d['fecha_iso'])")
          echo "Fecha de los datos: $FECHA_NUEVA"
          echo "fecha_nueva=$FECHA_NUEVA" >> $GITHUB_OUTPUT

          if [ -f .last_email_date ]; then
            FECHA_ULT=$(cat .last_email_date)
          else
            FECHA_ULT=""
          fi
          echo "Última fecha enviada: $FECHA_ULT"

          # Mandar email solo si hay datos nuevos (distinta fecha)
          if [ "$FECHA_NUEVA" != "$FECHA_ULT" ]; then
            echo "send_email=true" >> $GITHUB_OUTPUT
            echo "→ Hay datos nuevos: se envía email"
          else
            echo "send_email=false" >> $GITHUB_OUTPUT
            echo "→ Sin novedades: no se envía email"
          fi

      - name: Enviar email vía Resend
        if: steps.check.outputs.send_email == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python enviar_email_precios.py

      - name: Registrar fecha enviada
        if: steps.check.outputs.send_email == 'true'
        run: echo "${{ steps.check.outputs.fecha_nueva }}" > .last_email_date

      # === Reporte extendido quincenal (solo días 1 y 15) ===
      - name: Chequear si hoy toca reporte extendido (día 1 o 15)
        id: check_ext
        run: |
          HOY_AR=$(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d')
          DIA=$(TZ=America/Argentina/Buenos_Aires date '+%d')
          echo "hoy_ar=$HOY_AR" >> $GITHUB_OUTPUT
          if [ "$DIA" = "01" ] || [ "$DIA" = "15" ]; then
            echo "run_ext=true" >> $GITHUB_OUTPUT
            echo "→ Hoy es día $DIA — se genera reporte extendido quincenal"
          else
            echo "run_ext=false" >> $GITHUB_OUTPUT
            echo "→ Día $DIA — no toca reporte extendido"
          fi

      - name: Generar reporte extendido quincenal
        if: steps.check_ext.outputs.run_ext == 'true'
        run: python generar_extendido.py

      - name: Chequear si ya se envió el extendido hoy
        id: check_ext_email
        if: steps.check_ext.outputs.run_ext == 'true'
        run: |
          HOY=${{ steps.check_ext.outputs.hoy_ar }}
          if [ -f .last_email_extendido_date ]; then
            ULT=$(cat .last_email_extendido_date)
          else
            ULT=""
          fi
          echo "Última fecha extendido: $ULT   Hoy: $HOY"
          if [ "$HOY" != "$ULT" ]; then
            echo "send_ext=true" >> $GITHUB_OUTPUT
          else
            echo "send_ext=false" >> $GITHUB_OUTPUT
          fi

      - name: Enviar email reporte extendido
        if: steps.check_ext_email.outputs.send_ext == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python enviar_email_extendido.py

      - name: Registrar fecha extendido enviado
        if: steps.check_ext_email.outputs.send_ext == 'true'
        run: echo "${{ steps.check_ext.outputs.hoy_ar }}" > .last_email_extendido_date

      # === Reportes climáticos para Ing. Agrónomo Claudio Nader ===
      # Genera 2 PDFs: Abapó (Bolivia) y Tucumán (Lules + Concepción + El Naranjo).
      # Solo se envía email al Ing. una vez por día (primer run del día).
      - name: Generar reportes clima Nader (Abapó + Tucumán)
        id: nader_pdfs
        run: |
          mkdir -p informes
          python <<'PYEOF'
          import json, os, subprocess, sys, time
          cfg = json.load(open('config.json'))
          reportes = cfg.get('reportes_extra', [])
          ok, fail = [], []
          for r in reportes:
              locs = ','.join(r['localidades'])
              cmd = ['python', 'generar_informe.py',
                     '--cliente', r['cliente'],
                     '--localidades', locs,
                     '--salida', r['salida']]
              # Reintentar hasta 3 veces con espera creciente si falla
              # (la API de clima Open-Meteo a veces se cuelga)
              exito = False
              for intento in range(1, 4):
                  print(f"\n▶ {r['nombre']}  ({locs})  [intento {intento}/3]")
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  if res.returncode == 0 and os.path.exists(r['salida']):
                      size = os.path.getsize(r['salida'])
                      print(f"  ✓ {size} bytes en {r['salida']}")
                      ok.append(r['id'])
                      exito = True
                      break
                  else:
                      print(f"  ✗ Intento {intento} fallido")
                      print("  STDOUT:", res.stdout[-800:])
                      print("  STDERR:", res.stderr[-400:])
                      if intento < 3:
                          espera = 15 * intento
                          print(f"  ⏳ Esperando {espera}s antes de reintentar...")
                          time.sleep(espera)
              if not exito:
                  fail.append(r['id'])
          print(f"\nRESUMEN Nader: {len(ok)} OK, {len(fail)} fallidos")
          # Escribo flag para el próximo step: manda mail solo si TODOS OK
          # (así los cron siguientes reintentan hasta tener el reporte completo)
          gh_out = os.environ.get('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a') as f:
                  f.write(f"todos_ok={'true' if not fail else 'false'}\n")
                  f.write(f"algun_ok={'true' if ok else 'false'}\n")
          # No abortamos el job aunque falle algún reporte:
          # los PDFs que salieron OK se commitean igual (para la PWA)
          PYEOF

      - name: Detectar si ya se envió mail Nader hoy
        id: check_nader
        run: |
          HOY=$(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d')
          echo "hoy_ar=$HOY" >> $GITHUB_OUTPUT
          if [ -f .last_email_nader_date ]; then
            ULT=$(cat .last_email_nader_date)
          else
            ULT=""
          fi
          echo "Última fecha Nader: $ULT   Hoy ART: $HOY"
          # Solo mandamos si:
          #   1) Aún no mandamos hoy (dedup)
          #   2) TODOS los reportes se generaron OK (evita mails incompletos)
          TODOS_OK="${{ steps.nader_pdfs.outputs.todos_ok }}"
          echo "Todos los reportes OK: $TODOS_OK"
          if [ "$HOY" != "$ULT" ] && [ "$TODOS_OK" = "true" ]; then
            echo "send_nader=true" >> $GITHUB_OUTPUT
            echo "→ Se envía mail al Ing. Nader hoy (todos los reportes OK)"
          else
            echo "send_nader=false" >> $GITHUB_OUTPUT
            if [ "$TODOS_OK" != "true" ]; then
              echo "→ No se envía: algún reporte falló, esperamos próximo cron"
            else
              echo "→ Ya se envió hoy, se omite"
            fi
          fi

      - name: Enviar email al Ing. Nader (Abapó + Tucumán)
        if: steps.check_nader.outputs.send_nader == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python enviar_email_nader.py

      - name: Registrar fecha mail Nader
        if: steps.check_nader.outputs.send_nader == 'true'
        run: echo "${{ steps.check_nader.outputs.hoy_ar }}" > .last_email_nader_date

      - name: Commit PDFs + control al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios_hoy.pdf informes/precios_hoy.pdf informes/precios_hoy_resumen.json informes/por_zona/ informes/reporte_abapo.pdf informes/reporte_tucuman.pdf informes/extendido_hoy.pdf .last_email_date .last_email_nader_date .last_email_extendido_date 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar PDFs de precios + reportes clima Nader" && git push)
